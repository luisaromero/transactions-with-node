<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Order — Padel Store</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="top-bar">
      PADEL CIAGA — Designing products for women who play padel
    </div>
    <header class="header">
      <h1>Create New Order</h1>
      <a href="index.html">← Back to menu</a>
    </header>

    <main>
      <form id="form-search-address">
        <label for="rut">Customer National ID (RUT)</label>
        <input
          type="text"
          id="rut"
          name="rut"
          placeholder="12345678-5"
          required
        />
        <button type="submit">Search addresses</button>
      </form>

      <p id="msg-address"></p>

      <form id="form-crear-orden" class="text-hidden">
        <label for="address">Shipping address</label>
        <select id="address" required></select>

        <h3>Products</h3>
        <ul id="list-products-form"></ul>

        <button type="submit">Create order</button>
      </form>

      <p id="msg-result"></p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/createOrder.js"></script>
  </body>
</html>
