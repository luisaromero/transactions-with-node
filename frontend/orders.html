<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders by Customer — Padel Store</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="top-bar">
      PADEL CIAGA — Designing products for women who play padel
    </div>
    <header class="header">
      <h1>Customer Orders</h1>
      <a href="index.html">← Back to menu</a>
    </header>

    <main>
      <form id="form-search-orders">
        <label for="rut">National ID (RUT)</label>
        <input
          type="text"
          id="rut"
          name="rut"
          placeholder="12345678-5"
          required
        />
        <button type="submit">Search</button>
      </form>

      <p id="status-message"></p>
      <ul id="list-orders" class="orders-list"></ul>
    </main>

    <script src="js/api.js"></script>
    <script src="js/orders.js"></script>
  </body>
</html>
